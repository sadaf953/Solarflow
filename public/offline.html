<title>Offline - SolarFlow CRM</title>
<style>
  * { box-sizing: border-box; }
  html, body { background: #fafaf9; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 10px 40px rgba(28, 25, 23, 0.08);
    padding: 48px 32px;
    text-align: center;
  }
  .icon { width: 44px; height: 44px; margin: 0 auto 18px; color: #ff8a00; }
  .icon svg { width: 44px; height: 44px; display: block; }
  .brand {
    font-size: 12px; font-weight: 700; color: #a8a29e;
    text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px;
  }
  h1 { font-size: 22px; font-weight: 900; color: #1c1917; letter-spacing: -0.01em; margin: 0 0 12px; }
  p.reason { font-size: 13px; font-weight: 500; color: #78716c; line-height: 1.6; margin: 0 0 32px; }
  button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; padding: 14px; border: 0; border-radius: 16px;
    background: #ff8a00; color: #ffffff; font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #ea7a00; }
  .hint { font-size: 12px; color: #a8a29e; margin: 14px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
    </div>
    <div class="brand">SolarFlow CRM</div>
    <h1>You're offline</h1>
    <p class="reason">
      SolarFlow needs an internet connection to load live project data.
      Check your connection and try again.
    </p>
    <button type="button" id="retry">Try again</button>
    <p class="hint">This page reloads by itself when you're back online.</p>
  </main>
  <script>
    (function () {
      // Reload the URL the user was trying to open (or the app root).
      function retry() { location.reload(); }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    })();
  </script>
</body>
